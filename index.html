
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fresh Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Fresh Gallery</h1>
        <p>Explore Fresh and Healthy Products</p>
    </header>

    <main class="container">

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="fruits">Fruits</button>
            <button class="filter-btn" data-filter="vegetables">Vegetables</button>
            <button class="filter-btn" data-filter="dairy">Dairy</button>
        </div>

        <section class="gallery">

            <div class="gallery-item" data-category="fruits">
                <img src="https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a?w=600" alt="Apples">
                <h3>Fresh Apples</h3>
                <p>Fruits</p>
            </div>

            <div class="gallery-item" data-category="fruits">
                <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=600" alt="Bananas">
                <h3>Bananas</h3>
                <p>Fruits</p>
            </div>

            <div class="gallery-item" data-category="fruits">
                <img src="https://images.unsplash.com/photo-1547514701-42782101795e?w=600" alt="Oranges">
                <h3>Oranges</h3>
                <p>Fruits</p>
            </div>

            <div class="gallery-item" data-category="vegetables">
                <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600" alt="Broccoli">
                <h3>Broccoli</h3>
                <p>Vegetables</p>
            </div>

            <div class="gallery-item" data-category="vegetables">
                <img src="https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=600" alt="Tomatoes">
                <h3>Tomatoes</h3>
                <p>Vegetables</p>
            </div>

            <div class="gallery-item" data-category="vegetables">
                <img src="https://images.unsplash.com/photo-1518843875459-f738682238a6?w=600" alt="Carrots">
                <h3>Carrots</h3>
                <p>Vegetables</p>
            </div>

            <div class="gallery-item" data-category="dairy">
                <img src="https://images.unsplash.com/photo-1563636619-e9143da7973b?w=600" alt="Milk">
                <h3>Fresh Milk</h3>
                <p>Dairy</p>
            </div>

            <div class="gallery-item" data-category="dairy">
                <img src="https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=600" alt="Cheese">
                <h3>Cheese</h3>
                <p>Dairy</p>
            </div>

            <div class="gallery-item" data-category="dairy">
                <img src="https://images.unsplash.com/photo-1571212515416-fef01fc43637?w=600" alt="Yogurt">
                <h3>Yogurt</h3>
                <p>Dairy</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Fresh Gallery | Internship Task 1</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
